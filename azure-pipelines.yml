
# Node.js with React

trigger:
- master

pool:
  vmImage: 'ubuntu-24.04'

steps:
- task: UseNode@1
  inputs:
    version: '24.x'
  displayName: 'Install Node.js 24'

- script: |
    node --version
    npm --version
    npm install
    npm run build
  displayName: 'Install dependencies and build React application'