
trigger:
- master

pool:
  vmImage: 'ubuntu-24.04'

steps:
- task: UseNode@1
  inputs:
    version: '24.x'
  displayName: 'Install Node.js 24'

- script: |
    corepack enable
    corepack prepare yarn@1.22.22 --activate
    node --version
    yarn --version
    yarn install --frozen-lockfile
  displayName: 'Install dependencies using Yarn'

- script: |
    yarn test
  displayName: 'Run automated tests (Flow, ESLint, Jest)'

- script: |
    yarn build
  displayName: 'Build React application'
